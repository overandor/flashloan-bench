name: Bridge CI

on:
  push:
    branches: [main, harden-bridge-ci]
    paths:
      - 'bridge/**'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'

jobs:
  solidity:
    name: Solidity Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bridge/berachain
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: bridge/berachain/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run compile

  anchor:
    name: Anchor Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bridge/solana
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.solana.com/v1.18.4/install)"
      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
      - name: Set Anchor version
        run: avm install latest && avm use latest
      - name: Build Anchor program
        run: anchor build

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bridge/relayer
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: bridge/relayer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit || echo "TypeScript errors - fix before production"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
