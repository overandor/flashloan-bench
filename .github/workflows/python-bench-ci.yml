name: Python Bench CI

on:
  push:
    branches: [main, harden-bridge-ci]
  pull_request:
    branches: [main]

jobs:
  python-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Syntax check
        run: |
          python -m compileall bench scripts || true
      - name: Run benchmark smoke test
        run: |
          if [ -f bench/harness.py ]; then python bench/harness.py || true; fi
